<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 520" width="1140" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ps-title ps-desc">
  <title id="ps-title">Prompts guide, specs enforce</title>
  <desc id="ps-desc">Left-to-right request flow: prompt guides the agent; policy feeds the gateway; gateway allows or denies tool execution.</desc>
  <defs>
    <linearGradient id="ps-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <marker id="ps-g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00ff41"/>
    </marker>
    <marker id="ps-slate" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="ps-r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1140" height="520" rx="24" fill="url(#ps-bg)"/>
  <rect x="24" y="24" width="1092" height="472" rx="18" fill="none" stroke="#293029" stroke-width="1.5"/>
  <text x="68" y="68" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700">Prompts guide. Specs enforce.</text>
  <text x="68" y="96" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="14">Request path (top) · policy input (bottom) · deny is a hard stop before tools</text>
  <line x1="68" y1="114" x2="1072" y2="114" stroke="#293029"/>

  <!-- TOP ROW: prompt → agent → gateway → tools -->
  <g transform="translate(68,140)">
    <rect width="200" height="120" rx="12" fill="#0f120f" stroke="#64748b" stroke-width="1.5"/>
    <text x="16" y="32" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1">SOFT</text>
    <text x="16" y="58" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">System prompt</text>
    <text x="16" y="82" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="11">tone · task · narrative</text>
    <text x="16" y="102" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="9">probabilistic</text>
    <text x="16" y="118" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="9">not authorization</text>
  </g>

  <line x1="268" y1="200" x2="308" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ps-slate)"/>
  <text x="288" y="181" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">guides</text>

  <g transform="translate(308,140)">
    <rect width="200" height="120" rx="12" fill="#0f120f" stroke="#3c493e"/>
    <text x="16" y="32" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1">AGENT</text>
    <text x="16" y="58" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">LLM + planner</text>
    <text x="16" y="82" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="11">reads prompt</text>
    <text x="16" y="102" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="11">proposes tools/call</text>
  </g>

  <line x1="508" y1="200" x2="548" y2="200" stroke="#00ff41" stroke-width="1.5" marker-end="url(#ps-g)"/>
  <text x="528" y="181" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">request</text>

  <g transform="translate(548,128)">
    <rect width="280" height="144" rx="14" fill="#0a1a0d" stroke="#00ff41" stroke-width="2"/>
    <text x="18" y="36" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1">ENFORCEMENT</text>
    <text x="18" y="64" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">tools/call gateway</text>
    <text x="18" y="92" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="11">evaluates policy spec</text>
    <text x="18" y="112" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">no LLM in decision</text>
    <text x="18" y="132" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">OTel: verdict metadata</text>
  </g>

  <line x1="828" y1="200" x2="868" y2="200" stroke="#00ff41" stroke-width="1.5" marker-end="url(#ps-g)"/>
  <text x="848" y="181" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">allow</text>

  <g transform="translate(868,160)">
    <rect width="176" height="80" rx="12" fill="#0f120f" stroke="#3c493e"/>
    <text x="88" y="36" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle" font-weight="600">MCP tools</text>
    <text x="88" y="58" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">execute</text>
  </g>

  <!-- Deny leaves the gateway's bottom-right port and terminates at blocked. -->
  <line x1="788" y1="272" x2="788" y2="350" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ps-r)"/>
  <text x="804" y="313" fill="#ef4444" font-family="'IBM Plex Mono', monospace" font-size="11">deny</text>

  <g transform="translate(688,350)">
    <rect width="200" height="56" rx="10" fill="#1a1210" stroke="#ef4444" stroke-width="1.5"/>
    <text x="100" y="24" fill="#ef4444" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">blocked</text>
    <text x="100" y="42" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">audit + metric · no tool run</text>
  </g>

  <!-- BOTTOM: policy spec → gateway -->
  <g transform="translate(388,334)">
    <rect width="280" height="120" rx="12" fill="#0a1a0d" stroke="#00ff41" stroke-width="2"/>
    <text x="16" y="32" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1">HARD</text>
    <text x="16" y="58" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Policy spec</text>
    <text x="16" y="82" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="11">allow / deny / redact / chains</text>
    <text x="16" y="102" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">YAML · Cedar · proxy rules</text>
    <text x="16" y="112" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="9">deterministic truth</text>
  </g>

  <path d="M528 334 V310 H588 V272" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ps-g)"/>
  <text x="558" y="298" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">policy evaluate</text>

  <text x="68" y="478" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="12">Put non-negotiables in the hard layer — not in paragraph 12 of the system prompt.</text>
</svg>
