<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 580" width="1140" height="580" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pc-title pc-desc">
  <title id="pc-title">Prompt-as-code pipeline</title>
  <desc id="pc-desc">Linear CI pipeline for prompt fragments; parallel policy path into runtime enforcement.</desc>
  <defs>
    <linearGradient id="pc-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f120f"/>
    </linearGradient>
    <marker id="pc-arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00ff41"/>
    </marker>
    <marker id="pc-arr-dim" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1140" height="580" rx="24" fill="url(#pc-bg)"/>
  <rect x="24" y="24" width="1092" height="532" rx="18" fill="none" stroke="#293029" stroke-width="1.5"/>
  <text x="68" y="68" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700">Prompt-as-code in CI</text>
  <text x="68" y="96" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="14">Two lanes: prose fragments → render · policy YAML → enforcement</text>

  <!-- Main horizontal pipeline -->
  <text x="68" y="132" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="2">PROMPT LANE</text>

  <!-- Box positions: x=68, w=148, gap=36 → next at 252 -->
  <g transform="translate(68,148)">
    <rect width="148" height="88" rx="10" fill="#0f120f" stroke="#3c493e"/>
    <text x="14" y="28" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="1">1 · INPUT</text>
    <text x="14" y="52" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Fragments</text>
    <text x="14" y="72" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">*.md</text>
  </g>
  <line x1="216" y1="192" x2="252" y2="192" stroke="#00ff41" stroke-width="1.5" marker-end="url(#pc-arr)"/>

  <g transform="translate(252,148)">
    <rect width="148" height="88" rx="10" fill="#0f120f" stroke="#3c493e"/>
    <text x="14" y="28" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="1">2 · PR</text>
    <text x="14" y="52" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">CODEOWNERS</text>
    <text x="14" y="72" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">review</text>
  </g>
  <line x1="400" y1="192" x2="436" y2="192" stroke="#00ff41" stroke-width="1.5" marker-end="url(#pc-arr)"/>

  <g transform="translate(436,148)">
    <rect width="148" height="88" rx="10" fill="#0f120f" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="14" y="28" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="1">3 · CI</text>
    <text x="14" y="52" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">prompt lint</text>
    <text x="14" y="72" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">+ lockfile</text>
  </g>
  <line x1="584" y1="192" x2="620" y2="192" stroke="#00ff41" stroke-width="1.5" marker-end="url(#pc-arr)"/>

  <g transform="translate(620,148)">
    <rect width="148" height="88" rx="10" fill="#0a1a0d" stroke="#00ff41" stroke-width="1.5"/>
    <text x="14" y="28" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="1">4 · BUILD</text>
    <text x="14" y="52" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">render()</text>
    <text x="14" y="72" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">deterministic</text>
  </g>
  <line x1="768" y1="192" x2="804" y2="192" stroke="#00ff41" stroke-width="1.5" marker-end="url(#pc-arr)"/>

  <g transform="translate(804,148)">
    <rect width="148" height="88" rx="10" fill="#0a1a0d" stroke="#00ff41" stroke-width="2"/>
    <text x="14" y="28" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="1">5 · DEPLOY</text>
    <text x="14" y="52" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Agent host</text>
    <text x="14" y="72" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">system prompt</text>
  </g>

  <!-- Prompt lint verifies the lockfile; the lockfile does not generate fragments. -->
  <path d="M510 236 V280" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#pc-arr-dim)"/>
  <text x="524" y="263" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9">verify lockfile</text>
  <g transform="translate(68,280)">
    <rect width="700" height="64" rx="10" fill="#0f120f" stroke="#3c493e"/>
    <text x="18" y="28" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">prompts.lock.json</text>
    <text x="18" y="48" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="11">sha256 per fragment · PR shows rendered diff · fail CI on drift</text>
  </g>

  <!-- Policy lane -->
  <text x="68" y="408" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="2">POLICY LANE (PARALLEL)</text>

  <g transform="translate(68,424)">
    <rect width="280" height="88" rx="12" fill="#0f120f" stroke="#64748b" stroke-dasharray="6 4"/>
    <text x="18" y="32" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11">policies/*.yaml</text>
    <text x="18" y="56" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14">Security-owned spec</text>
    <text x="18" y="76" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">not merged into prose prompt</text>
  </g>

  <line x1="348" y1="468" x2="464" y2="468" stroke="#00ff41" stroke-width="1.5" marker-end="url(#pc-arr)"/>
  <text x="406" y="450" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">load at runtime</text>

  <g transform="translate(464,424)">
    <rect width="344" height="88" rx="12" fill="#0a1a0d" stroke="#00ff41" stroke-width="1.8"/>
    <text x="18" y="32" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="11">MCP proxy / agent RASP</text>
    <text x="18" y="56" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14">tools/call enforcement</text>
    <text x="18" y="76" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">allow · deny · redact · audit</text>
  </g>

  <line x1="808" y1="468" x2="868" y2="468" stroke="#00ff41" stroke-width="1.5" marker-end="url(#pc-arr)"/>

  <g transform="translate(868,424)">
    <rect width="204" height="88" rx="12" fill="#0f120f" stroke="#3c493e"/>
    <text x="102" y="48" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">MCP tools</text>
    <text x="102" y="68" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">only if policy allows</text>
  </g>

  <!-- Runtime requests leave Agent host and enter the enforcement boundary. -->
  <path d="M878 236 V376 Q878 384 870 384 H788 Q780 384 780 392 V424" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#pc-arr-dim)"/>
  <text x="829" y="370" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">tool calls</text>

  <text x="68" y="548" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="12">Prompt lane shapes behavior · policy lane decides execution</text>
</svg>
