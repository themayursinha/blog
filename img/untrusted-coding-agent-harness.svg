<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" width="1140" height="620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="uah-title uah-desc">
  <title id="uah-title">Untrusted coding agent and controlled acceptance harness</title>
  <desc id="uah-desc">A coding agent proposes a patch. A verification harness checks contracts, invariants, tests, and evidence. Failed changes return to the loop; passing evidence proceeds to human review and merge.</desc>
  <defs>
    <linearGradient id="uah-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f120f"/>
    </linearGradient>
    <marker id="uah-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00ff41"/>
    </marker>
    <marker id="uah-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/>
    </marker>
    <marker id="uah-slate" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="uah-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1140" height="620" rx="24" fill="url(#uah-bg)"/>
  <rect x="24" y="24" width="1092" height="572" rx="18" fill="none" stroke="#293029" stroke-width="1.5"/>
  <text x="68" y="70" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="27" font-weight="700">The coding agent is an untrusted proposer</text>
  <text x="68" y="100" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="14">Generation stays probabilistic. Acceptance belongs to independently controlled checks.</text>
  <line x1="68" y1="120" x2="1072" y2="120" stroke="#293029"/>

  <text x="68" y="154" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="2">PROPOSAL ZONE</text>
  <text x="590" y="154" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="2">ACCEPTANCE BOUNDARY</text>
  <rect x="576" y="136" width="514" height="392" rx="16" fill="none" stroke="#3c493e" stroke-width="1.2" stroke-dasharray="7 5"/>

  <g>
    <rect x="68" y="190" width="210" height="150" rx="14" fill="#0f120f" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="88" y="222" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1">UNTRUSTED</text>
    <text x="88" y="252" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Coding agent</text>
    <text x="88" y="280" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="11">inspect · patch · retry</text>
    <text x="88" y="306" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="10">may propose</text>
    <text x="88" y="326" fill="#ef4444" font-family="'IBM Plex Mono', monospace" font-size="10">may not certify</text>
  </g>

  <g>
    <rect x="334" y="208" width="190" height="114" rx="12" fill="#0f120f" stroke="#3c493e"/>
    <text x="354" y="238" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1">CANDIDATE</text>
    <text x="354" y="268" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Working-tree patch</text>
    <text x="354" y="294" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">code + tests + docs</text>
  </g>

  <line x1="278" y1="265" x2="334" y2="265" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#uah-slate)"/>
  <text x="306" y="248" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">proposes</text>

  <g>
    <rect x="610" y="176" width="270" height="248" rx="14" fill="#0a1a0d" stroke="#00ff41" stroke-width="1.8"/>
    <text x="632" y="208" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1">VERIFICATION HARNESS</text>
    <text x="632" y="237" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Encoded acceptance criteria</text>

    <rect x="632" y="256" width="226" height="34" rx="7" fill="#0f120f" stroke="#3c493e"/>
    <text x="648" y="278" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="10">project contract</text>
    <rect x="632" y="300" width="226" height="34" rx="7" fill="#0f120f" stroke="#3c493e"/>
    <text x="648" y="322" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="10">named invariants</text>
    <rect x="632" y="344" width="226" height="34" rx="7" fill="#0f120f" stroke="#3c493e"/>
    <text x="648" y="366" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="10">observable tests</text>
    <text x="632" y="405" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10">evidence tied to commit</text>
  </g>

  <line x1="524" y1="265" x2="610" y2="265" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#uah-slate)"/>
  <text x="567" y="248" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">evaluate</text>

  <g>
    <rect x="930" y="190" width="142" height="130" rx="13" fill="#16140d" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1001" y="222" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" letter-spacing="1">AUTHORITY</text>
    <text x="1001" y="254" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Human review</text>
    <text x="1001" y="280" fill="#a79f82" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">risk · scope · claims</text>
    <text x="1001" y="300" fill="#a79f82" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">invariant changes</text>
  </g>

  <line x1="880" y1="255" x2="930" y2="255" stroke="#00ff41" stroke-width="1.5" marker-end="url(#uah-green)"/>
  <text x="905" y="238" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">pass</text>

  <g>
    <rect x="930" y="378" width="142" height="64" rx="11" fill="#0a1a0d" stroke="#00ff41" stroke-width="1.5"/>
    <text x="1001" y="406" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" letter-spacing="1">ACCEPT</text>
    <text x="1001" y="428" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Merge</text>
  </g>
  <line x1="1001" y1="320" x2="1001" y2="378" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#uah-amber)"/>
  <text x="1017" y="353" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="9">approve</text>

  <path d="M745 424 V478 H173 V340" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#uah-red)"/>
  <text x="464" y="465" fill="#ef4444" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">reject · return evidence to loop</text>

  <text x="68" y="566" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="12">A passing harness supports encoded properties. It does not prove the property set is complete.</text>
</svg>
