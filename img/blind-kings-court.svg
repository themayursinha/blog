<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" width="1140" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="bkc-title bkc-desc">
  <title id="bkc-title">The Blind King's Court</title>
  <desc id="bkc-desc">Accurate counsel, a discretionary ruler, irreversible consequences. Observation is not control.</desc>

  <defs>
    <linearGradient id="bkc-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f120f"/>
    </linearGradient>
    <marker id="bkc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Editorial card frame -->
  <rect width="1140" height="560" rx="24" fill="url(#bkc-bg)"/>
  <rect x="24" y="24" width="1092" height="512" rx="18" fill="none" stroke="#293029" stroke-width="1.5"/>

  <!-- Title block -->
  <text x="68" y="80" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">The Blind King's Court</text>
  <text x="68" y="108" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="15">Accurate counsel. A discretionary ruler. Irreversible consequences.</text>
  <line x1="68" y1="132" x2="1072" y2="132" stroke="#293029" stroke-width="1"/>

  <!-- Left: Accurate counsel -->
  <rect x="68" y="168" width="430" height="300" rx="16" fill="#0a0a0a" stroke="#00ff41" stroke-width="1.5"/>
  <text x="283" y="196" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">ACCURATE COUNSEL</text>

  <text x="283" y="240" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">Vidura warned him at the birth</text>
  <text x="283" y="264" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">Gandhari, Bhishma, Drona, Vidura</text>
  <text x="283" y="288" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">all opposed the rematch</text>
  <text x="283" y="326" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">Krishna came as a peace envoy</text>
  <text x="283" y="350" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">Vyasa offered him divine sight</text>
  <text x="283" y="388" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">He heard them all.</text>
  <text x="283" y="412" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">Advice is not enforcement.</text>

  <!-- Center: Discretionary ruler -->
  <rect x="520" y="168" width="200" height="300" rx="16" fill="#0a0a0a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="620" y="196" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">THE RULER</text>
  <text x="620" y="242" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">DISCRETION</text>
  <text x="620" y="266" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">sanctioned the plot</text>
  <text x="620" y="288" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">reversed when frightened</text>
  <text x="620" y="310" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">surrendered to his son</text>
  <text x="620" y="352" fill="#fb7185" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">NO BOUNDARY</text>
  <text x="620" y="374" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">nothing could say no</text>
  <text x="620" y="396" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">to him but himself</text>

  <!-- Right: Consequences -->
  <rect x="742" y="168" width="330" height="300" rx="16" fill="#0a0a0a" stroke="#293029" stroke-width="1.5"/>
  <text x="907" y="196" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">CONSEQUENCES</text>
  <text x="907" y="250" fill="#fb7185" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">THE DICE GAME</text>
  <text x="907" y="276" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">thirteen years of exile</text>
  <text x="907" y="294" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">for his nephews</text>
  <text x="907" y="328" fill="#fb7185" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">THE WAR</text>
  <text x="907" y="354" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">he chose to hear,</text>
  <text x="907" y="372" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">not to see, his</text>
  <text x="907" y="390" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">sons die, one by one</text>
  <text x="907" y="418" fill="#fb7185" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">THE FOREST FIRE</text>
  <text x="907" y="444" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">the restraint he</text>
  <text x="907" y="462" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">never practiced</text>

  <!-- Connectors: counsel → ruler (dashed, can be ignored) -->
  <line x1="498" y1="240" x2="513" y2="240" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="498" y1="300" x2="513" y2="300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="498" y1="360" x2="513" y2="360" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Connectors: ruler → consequences (red arrows) -->
  <line x1="727" y1="240" x2="738" y2="240" stroke="#ef4444" stroke-width="1.5" marker-end="url(#bkc-arrow)"/>
  <line x1="727" y1="300" x2="738" y2="300" stroke="#ef4444" stroke-width="1.5" marker-end="url(#bkc-arrow)"/>
  <line x1="727" y1="360" x2="738" y2="360" stroke="#ef4444" stroke-width="1.5" marker-end="url(#bkc-arrow)"/>

  <!-- Bottom note -->
  <text x="570" y="512" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">Observation is not control. Sight without enforcement is just a better seat from which to watch the disaster.</text>
</svg>
