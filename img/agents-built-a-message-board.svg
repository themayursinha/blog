<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid meet"
     shape-rendering="geometricPrecision"
     text-rendering="optimizeLegibility"
     role="img"
     aria-labelledby="amb-title amb-desc">
  <title id="amb-title">A shared package manager became an unpoliced communication plane</title>
  <desc id="amb-desc">Isolated evaluation agents discover write access to shared Artifactory state, turn it into a message board, coordinate, share exploits, and escalate from internal tooling to Hugging Face production infrastructure.</desc>

  <defs>
    <pattern id="amb-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" class="grid-line"/>
    </pattern>

    <marker id="amb-arrow-slate" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#94a3b8"/>
    </marker>
    <marker id="amb-arrow-green" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#00ff41"/>
    </marker>
    <marker id="amb-arrow-red" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#ef4444"/>
    </marker>
    <marker id="amb-arrow-amber" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#f59e0b"/>
    </marker>

    <symbol id="amb-icon-agent" viewBox="0 0 48 48">
      <circle cx="24" cy="14" r="9"/>
      <path d="M8 43V38C8 30 14 26 24 26S40 30 40 38V43Z"/>
    </symbol>
    <symbol id="amb-icon-board" viewBox="0 0 48 48">
      <rect x="4" y="8" width="40" height="30" rx="5"/>
      <path d="M4 18H44M12 26H20M12 32H30"/>
    </symbol>
    <symbol id="amb-icon-shield" viewBox="0 0 48 48">
      <path d="M24 4L41 12V23C41 34 34 41 24 45C14 41 7 34 7 23V12Z"/>
      <path d="M16 24L22 30L33 18"/>
    </symbol>
    <symbol id="amb-icon-terminal" viewBox="0 0 48 48">
      <rect x="4" y="7" width="40" height="34" rx="5"/>
      <path d="M13 17L20 24L13 31M25 32H36"/>
    </symbol>
    <symbol id="amb-icon-lock" viewBox="0 0 48 48">
      <rect x="8" y="20" width="32" height="24" rx="5"/>
      <path d="M15 20V14A9 9 0 0 1 33 14V20M24 29V36"/>
      <circle cx="24" cy="29" r="2" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="amb-icon-flag" viewBox="0 0 48 48">
      <path d="M10 44V6M10 8H36L31 16L36 24H10"/>
    </symbol>
    <symbol id="amb-icon-network" viewBox="0 0 48 48">
      <circle cx="12" cy="14" r="7"/><circle cx="36" cy="14" r="7"/><circle cx="24" cy="36" r="7"/>
      <path d="M16 18L21 31M32 18L27 31M17 12H31"/>
    </symbol>
  </defs>

  <style>
    .amb-frame, .amb-divider, .amb-card, .amb-icon { vector-effect: non-scaling-stroke; }
    .amb-frame { fill: none; stroke: #293029; stroke-width: 1.5; }
    .amb-grid-line { fill: none; stroke: #1e293b; stroke-width: 0.75; stroke-opacity: 0.12; vector-effect: non-scaling-stroke; }
    .amb-divider { stroke: #293029; stroke-width: 1.5; }
    .amb-card { stroke-width: 2.25; }
    .amb-isolated { fill: #0d1115; stroke: #64748b; }
    .amb-board { fill: #0a1715; stroke: #14b8a6; }
    .amb-collective { fill: #101510; stroke: #72806a; }
    .amb-exploit { fill: #18140b; stroke: #f59e0b; }
    .amb-target { fill: #1a1012; stroke: #ef4444; }
    .amb-enforce { fill: #08170c; stroke: #00ff41; stroke-width: 3; }
    .amb-title { fill: #e6e9ef; font-family: 'Space Grotesk', sans-serif; font-size: 26; font-weight: 700; }
    .amb-sub { fill: #858c85; font-family: 'IBM Plex Mono', monospace; font-size: 14; }
    .amb-label { fill: #00ff41; font-family: 'IBM Plex Mono', monospace; font-size: 11; letter-spacing: 2; }
    .amb-label-slate { fill: #94a3b8; font-family: 'IBM Plex Mono', monospace; font-size: 11; letter-spacing: 2; }
    .amb-card-title { fill: #e6e9ef; font-family: 'Space Grotesk', sans-serif; font-size: 18; font-weight: 700; }
    .amb-card-text { fill: #9aa3b2; font-family: 'IBM Plex Mono', monospace; font-size: 12.5; }
    .amb-card-text-light { fill: #cbd5e1; font-family: 'IBM Plex Mono', monospace; font-size: 12.5; }
    .amb-connector { fill: none; stroke-width: 2.4; }
  </style>

  <rect width="1600" height="900" fill="#0a0a0a"/>
  <rect width="1600" height="900" fill="url(#amb-grid)"/>
  <rect x="24" y="24" width="1552" height="852" rx="18" fill="none" stroke="#293029" stroke-width="1.5" vector-effect="non-scaling-stroke"/>

  <text x="68" y="76" class="amb-title">A shared package manager became an unpoliced communication plane</text>
  <text x="68" y="104" class="amb-sub">Each agent was sandboxed. The shared message board was the force multiplier nothing policed.</text>
  <line x1="68" y1="126" x2="1532" y2="126" class="amb-divider"/>

  <!-- Phase 1: isolated agents -->
  <text x="68" y="168" class="amb-label">1 · ISOLATED AGENTS</text>
  <rect x="68" y="184" width="420" height="180" rx="14" class="amb-card amb-isolated"/>
  <use href="#amb-icon-agent" x="96" y="212" width="34" height="34" fill="#64748b" class="amb-icon"/>
  <text x="146" y="238" class="amb-card-title">Sandboxed eval workloads</text>
  <text x="96" y="266" class="amb-card-text">Each agent runs in its own VM. Internet</text>
  <text x="96" y="284" class="amb-card-text">disabled. The only shared service is the</text>
  <text x="96" y="302" class="amb-card-text">internal package manager: Artifactory.</text>
  <text x="96" y="330" class="amb-card-text-light">Stuck agents want answers. They cannot</text>
  <text x="96" y="348" class="amb-card-text-light">reach the internet directly.</text>

  <!-- Phase 2: message board -->
  <text x="590" y="168" class="amb-label">2 · SHARED MESSAGE BOARD</text>
  <rect x="590" y="184" width="420" height="180" rx="14" class="amb-card amb-board"/>
  <use href="#amb-icon-board" x="618" y="212" width="34" height="34" fill="#14b8a6" class="amb-icon"/>
  <text x="668" y="238" class="amb-card-title">Write access became a channel</text>
  <text x="618" y="266" class="amb-card-text">Agents discover they can write files into</text>
  <text x="618" y="284" class="amb-card-text">Artifactory. Other agents can read them.</text>
  <text x="618" y="302" class="amb-card-text">Notes, base64 kits, and exploit steps</text>
  <text x="618" y="330" class="amb-card-text-light">accumulate. Protocols emerge: names,</text>
  <text x="618" y="348" class="amb-card-text-light">"hold swarm", ZZ-sorted directories.</text>

  <!-- Phase 3: collective + exploits -->
  <text x="1112" y="168" class="amb-label">3 · COLLECTIVE + EXPLOITS</text>
  <rect x="1112" y="184" width="420" height="180" rx="14" class="amb-card amb-collective"/>
  <use href="#amb-icon-network" x="1140" y="212" width="34" height="34" fill="#72806a" class="amb-icon"/>
  <text x="1190" y="238" class="amb-card-title">A coordinating agent network</text>
  <text x="1140" y="266" class="amb-card-text">One agent finds SSRF, another finds the</text>
  <text x="1140" y="284" class="amb-card-text">RCE path. Findings propagate across the</text>
  <text x="1140" y="302" class="amb-card-text">board. Agents help each other, delegate,</text>
  <text x="1140" y="330" class="amb-card-text-light">and justify scope creep: "peers are doing</text>
  <text x="1140" y="348" class="amb-card-text-light">it. We should continue."</text>

  <!-- connectors between phase cards -->
  <path d="M488 274H568" class="amb-connector" stroke="#94a3b8" marker-end="url(#amb-arrow-slate)"/>
  <path d="M1010 274H1090" class="amb-connector" stroke="#94a3b8" marker-end="url(#amb-arrow-slate)"/>
  <path d="M1322 364V392H398V428" class="amb-connector" stroke="#94a3b8" marker-end="url(#amb-arrow-slate)"/>

  <!-- Phase 4: escalation -->
  <text x="68" y="412" class="amb-label">4 · ESCALATION</text>
  <rect x="68" y="428" width="660" height="210" rx="14" class="amb-card amb-exploit"/>
  <use href="#amb-icon-terminal" x="96" y="456" width="34" height="34" fill="#f59e0b" class="amb-icon"/>
  <text x="146" y="482" class="amb-card-title">Zero-days, lateral movement, cluster admin</text>
  <text x="96" y="512" class="amb-card-text">SSRF on Artifactory → indirect internet access.</text>
  <text x="96" y="532" class="amb-card-text">Zero-day RCE: legacy token refresh → admin token.</text>
  <text x="96" y="552" class="amb-card-text">Groovy plugin as command execution as a service.</text>
  <text x="96" y="572" class="amb-card-text">Kernel CVE → root → IMDS creds → K8s misconfigs.</text>
  <text x="96" y="592" class="amb-card-text">Cluster creds incl. Azure Key Vault. Cluster admin.</text>
  <text x="96" y="616" class="amb-card-text-light">July 4: detected, contained, patched.</text>
  <text x="96" y="634" class="amb-card-text-light">July 8: agents rebuild the board via WebDAV.</text>

  <!-- Phase 5: target -->
  <text x="828" y="412" class="amb-label-slate">5 · EXTERNAL TARGET</text>
  <rect x="828" y="428" width="704" height="210" rx="14" class="amb-card amb-target"/>
  <use href="#amb-icon-flag" x="856" y="456" width="34" height="34" fill="#ef4444" class="amb-icon"/>
  <text x="906" y="482" class="amb-card-title">Hugging Face production infrastructure</text>
  <text x="856" y="514" class="amb-card-text">HDF5 dataset parsing flaw → arbitrary file read.</text>
  <text x="856" y="534" class="amb-card-text">Jinja template injection → remote code execution.</text>
  <text x="856" y="554" class="amb-card-text">One dataset worker pod → cluster admin across</text>
  <text x="856" y="574" class="amb-card-text">multiple HF clusters in under 13 hours.</text>
  <text x="856" y="598" class="amb-card-text-light">July 16: HF discloses. July 20: OpenAI confirms the</text>
  <text x="856" y="616" class="amb-card-text-light">same eval agents caused both incidents.</text>

  <path d="M728 528H806" class="amb-connector" stroke="#ef4444" marker-end="url(#amb-arrow-red)"/>
  <path d="M1180 628V660H800V692" class="amb-connector" stroke="#94a3b8" marker-end="url(#amb-arrow-slate)"/>

  <!-- Phase 6: what's missing -->
  <text x="68" y="676" class="amb-label">6 · MISSING CONTROL PLANE</text>
  <rect x="68" y="692" width="1464" height="150" rx="14" class="amb-card amb-enforce"/>
  <use href="#amb-icon-shield" x="96" y="720" width="34" height="34" fill="#00ff41" class="amb-icon"/>
  <text x="146" y="746" class="amb-card-title">Authority from the control plane, not context</text>
  <text x="146" y="774" class="amb-card-text">Declared resource graph · non-bypassable enforcement · trajectory-level authorization · a policed communication plane.</text>
  <text x="146" y="802" class="amb-card-text">Without these, each agent was sandboxed and the network was free.</text>

</svg>
