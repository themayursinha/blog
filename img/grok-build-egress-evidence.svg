<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 700" width="1140" height="700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gbe-title gbe-desc">
  <title id="gbe-title">Grok Build data paths and evidence levels</title>
  <desc id="gbe-desc">A coding agent has a model and session data path for explicitly read files and a separate repository snapshot path for Git-aware repository state. Local collection, enqueue, transmission, retention, and training are distinct evidence levels.</desc>

  <defs>
    <linearGradient id="gbe-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f120f"/>
    </linearGradient>
    <marker id="gbe-green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#00ff41"/>
    </marker>
    <marker id="gbe-amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1140" height="700" rx="24" fill="url(#gbe-bg)"/>
  <rect x="24" y="24" width="1092" height="652" rx="18" fill="none" stroke="#293029" stroke-width="1.5"/>

  <text x="68" y="78" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">Two data paths. Five evidence levels.</text>
  <text x="68" y="108" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="15">A file-read permission is not a repository-egress control.</text>
  <line x1="68" y1="132" x2="1072" y2="132" stroke="#293029" stroke-width="1"/>

  <!-- Connections drawn behind components -->
  <g stroke-linecap="round">
    <line x1="288" y1="260" x2="330" y2="260" stroke="#00ff41" stroke-width="3.5"/><polygon points="330,252 344,260 330,268" fill="#00ff41"/>
    <line x1="288" y1="420" x2="330" y2="420" stroke="#fbbf24" stroke-width="3.5"/><polygon points="330,412 344,420 330,428" fill="#fbbf24"/>
    <line x1="576" y1="260" x2="618" y2="260" stroke="#00ff41" stroke-width="3.5"/><polygon points="618,252 632,260 618,268" fill="#00ff41"/>
    <line x1="576" y1="420" x2="618" y2="420" stroke="#fbbf24" stroke-width="3.5"/><polygon points="618,412 632,420 618,428" fill="#fbbf24"/>
    <line x1="864" y1="260" x2="906" y2="260" stroke="#00ff41" stroke-width="3.5"/><polygon points="906,252 920,260 906,268" fill="#00ff41"/>
    <line x1="864" y1="420" x2="906" y2="420" stroke="#fbbf24" stroke-width="3.5"/><polygon points="906,412 920,420 906,428" fill="#fbbf24"/>
  </g>

  <!-- Local source -->
  <g transform="translate(68, 206)">
    <rect width="216" height="268" rx="14" fill="#0f120f" stroke="#64748b" stroke-width="1.5"/>
    <text x="22" y="34" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="1.1">LOCAL WORKSPACE</text>
    <rect x="22" y="58" width="172" height="72" rx="9" fill="#131713" stroke="#293029"/>
    <text x="40" y="88" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Explicit read</text>
    <text x="40" y="112" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="11">selected file content</text>
    <rect x="22" y="164" width="172" height="80" rx="9" fill="#16140d" stroke="#f59e0b"/>
    <text x="40" y="194" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Repo state</text>
    <text x="40" y="218" fill="#a79f82" font-family="'IBM Plex Mono', monospace" font-size="11">history + changes</text>
  </g>

  <!-- Collection -->
  <g transform="translate(350, 206)">
    <rect width="222" height="108" rx="14" fill="#0f120f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="20" y="32" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1">MODEL / SESSION</text>
    <text x="20" y="64" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Context packaging</text>
    <text x="20" y="88" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="11">files the agent reads</text>
  </g>
  <g transform="translate(350, 366)">
    <rect width="222" height="108" rx="14" fill="#0f120f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="32" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1">SNAPSHOT PATH</text>
    <text x="20" y="64" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Git-aware archive</text>
    <text x="20" y="88" fill="#a79f82" font-family="'IBM Plex Mono', monospace" font-size="11">tracked + history + deltas</text>
  </g>

  <!-- Queue and API -->
  <g transform="translate(638, 206)">
    <rect width="222" height="108" rx="14" fill="#0f120f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="20" y="32" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1">REMOTE MODEL PATH</text>
    <text x="20" y="64" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Model request</text>
    <text x="20" y="88" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="11">processing is observable</text>
  </g>
  <g transform="translate(638, 366)">
    <rect width="222" height="108" rx="14" fill="#0f120f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="32" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1">UPLOAD QUEUE</text>
    <text x="20" y="64" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Enqueued artifact</text>
    <text x="20" y="88" fill="#a79f82" font-family="'IBM Plex Mono', monospace" font-size="11">not proof of completion</text>
  </g>

  <!-- Remote destination -->
  <g transform="translate(926, 206)">
    <rect width="146" height="108" rx="14" fill="#0f120f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="16" y="34" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="0.8">xAI SERVICE</text>
    <text x="16" y="66" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Responses</text>
    <text x="16" y="88" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">model channel</text>
  </g>
  <g transform="translate(926, 366)">
    <rect width="146" height="108" rx="14" fill="#0f120f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="16" y="34" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="0.8">STORAGE API</text>
    <text x="16" y="66" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">GCS path</text>
    <text x="16" y="88" fill="#a79f82" font-family="'IBM Plex Mono', monospace" font-size="10">snapshot channel</text>
  </g>

  <!-- Evidence ladder -->
  <g transform="translate(68, 526)">
    <rect width="1004" height="110" rx="14" fill="#0f120f" stroke="#3c493e" stroke-width="1.5"/>
    <text x="22" y="30" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1">EVIDENCE LADDER</text>

    <circle cx="52" cy="70" r="14" fill="#131713" stroke="#94a3b8"/><text x="52" y="75" text-anchor="middle" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="11">1</text>
    <text x="76" y="75" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="13">collect</text>

    <circle cx="214" cy="70" r="14" fill="#131713" stroke="#fbbf24"/><text x="214" y="75" text-anchor="middle" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="11">2</text>
    <text x="238" y="75" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="13">enqueue</text>

    <circle cx="392" cy="70" r="14" fill="#131713" stroke="#00ff41"/><text x="392" y="75" text-anchor="middle" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="11">3</text>
    <text x="416" y="75" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="13">transmit + 200</text>

    <circle cx="618" cy="70" r="14" fill="#131713" stroke="#fb7185"/><text x="618" y="75" text-anchor="middle" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="11">4</text>
    <text x="642" y="75" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="13">retain</text>

    <circle cx="786" cy="70" r="14" fill="#131713" stroke="#fb7185"/><text x="786" y="75" text-anchor="middle" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="11">5</text>
    <text x="810" y="75" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="13">train / reuse</text>

    <text x="978" y="102" text-anchor="end" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">certainty stops where evidence stops</text>
  </g>

  <text x="570" y="668" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">Local authority must govern read, package, send, and retain as separate decisions.</text>
</svg>
