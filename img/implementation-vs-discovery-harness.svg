<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" width="1140" height="620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ivd-title ivd-desc">
  <title id="ivd-title">Implementation harness and discovery harness</title>
  <desc id="ivd-desc">The implementation harness verifies known invariants. The discovery harness searches for counterexamples. A discovered failure is minimized into a fixture and promoted into a new invariant.</desc>
  <defs>
    <linearGradient id="ivd-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f120f"/>
    </linearGradient>
    <marker id="ivd-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00ff41"/>
    </marker>
    <marker id="ivd-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/>
    </marker>
    <marker id="ivd-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>
    <marker id="ivd-slate" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1140" height="620" rx="24" fill="url(#ivd-bg)"/>
  <rect x="24" y="24" width="1092" height="572" rx="18" fill="none" stroke="#293029" stroke-width="1.5"/>
  <text x="68" y="70" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="27" font-weight="700">Verification and discovery are different loops</text>
  <text x="68" y="100" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="14">One checks known properties. The other searches for the property you forgot.</text>
  <line x1="68" y1="120" x2="1072" y2="120" stroke="#293029"/>

  <g>
    <rect x="68" y="150" width="452" height="366" rx="16" fill="#0f120f" stroke="#00ff41" stroke-width="1.5"/>
    <text x="92" y="184" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="2">IMPLEMENTATION HARNESS</text>
    <text x="92" y="215" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="700">Does this patch preserve known invariants?</text>

    <rect x="100" y="250" width="176" height="62" rx="10" fill="#0a1a0d" stroke="#3c493e"/>
    <text x="118" y="276" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">INPUT</text>
    <text x="118" y="297" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Candidate patch</text>

    <rect x="312" y="250" width="176" height="62" rx="10" fill="#0a1a0d" stroke="#3c493e"/>
    <text x="330" y="276" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">CONTRACT</text>
    <text x="330" y="297" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Named invariants</text>

    <rect x="100" y="350" width="176" height="62" rx="10" fill="#0a1a0d" stroke="#00ff41"/>
    <text x="118" y="376" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="9">EXECUTE</text>
    <text x="118" y="397" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Observable checks</text>

    <rect x="312" y="350" width="176" height="62" rx="10" fill="#0a1a0d" stroke="#00ff41"/>
    <text x="330" y="376" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="9">DECIDE</text>
    <text x="330" y="397" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Accept or reject</text>

    <line x1="276" y1="281" x2="312" y2="281" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ivd-slate)"/>
    <path d="M400 312 V332 H188 V350" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ivd-green)"/>
    <line x1="276" y1="381" x2="312" y2="381" stroke="#00ff41" stroke-width="1.5" marker-end="url(#ivd-green)"/>

    <path d="M400 412 V456 H188 V412" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ivd-red)"/>
    <text x="294" y="447" fill="#ef4444" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">reject → revise patch</text>
    <text x="294" y="490" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">repeatable acceptance for encoded properties</text>
  </g>

  <g>
    <rect x="620" y="150" width="452" height="366" rx="16" fill="#0f120f" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="644" y="184" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="2">DISCOVERY HARNESS</text>
    <text x="644" y="215" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="700">Which important property is missing?</text>

    <rect x="652" y="250" width="176" height="62" rx="10" fill="#16140d" stroke="#f59e0b"/>
    <text x="670" y="276" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="9">PERTURB</text>
    <text x="670" y="297" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Mutate · fuzz · race</text>

    <rect x="864" y="250" width="176" height="62" rx="10" fill="#16140d" stroke="#f59e0b"/>
    <text x="882" y="276" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="9">STRESS</text>
    <text x="882" y="297" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Faults · transports</text>

    <rect x="652" y="350" width="176" height="62" rx="10" fill="#1a1210" stroke="#ef4444"/>
    <text x="670" y="376" fill="#ef4444" font-family="'IBM Plex Mono', monospace" font-size="9">OBSERVE</text>
    <text x="670" y="397" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Counterexample</text>

    <rect x="864" y="350" width="176" height="62" rx="10" fill="#16140d" stroke="#f59e0b"/>
    <text x="882" y="376" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="9">MINIMIZE</text>
    <text x="882" y="397" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Fixture + property</text>

    <line x1="828" y1="281" x2="864" y2="281" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ivd-amber)"/>
    <path d="M952 312 V332 H740 V350" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ivd-amber)"/>
    <line x1="828" y1="381" x2="864" y2="381" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ivd-red)"/>
    <path d="M952 412 V456 H740 V412" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ivd-amber)"/>
    <text x="846" y="447" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">search again</text>
    <text x="846" y="490" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">successful output: a new failure we can encode</text>
  </g>

  <path d="M1040 381 H1052 V232 H570 V304" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ivd-amber)"/>
  <line x1="530" y1="332" x2="488" y2="332" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ivd-amber)"/>
  <rect x="530" y="304" width="80" height="56" rx="9" fill="#16140d" stroke="#f59e0b"/>
  <text x="570" y="326" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">PROMOTE</text>
  <text x="570" y="345" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">new invariant</text>

  <text x="68" y="566" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="12">Discovery expands the contract. Implementation makes the expanded contract repeatable.</text>
</svg>
