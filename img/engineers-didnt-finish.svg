<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" width="1140" height="620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="edf-title edf-desc">
  <title id="edf-title">Capability without a guarantee</title>
  <desc id="edf-desc">Human capabilities and human failure modes converge on one conclusion: observed behaviour is evidence, while designer intent is not a control.</desc>
  <defs>
    <linearGradient id="edf-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="edf-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="edf-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#00ff41"/>
    </marker>
    <marker id="edf-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ef4444"/>
    </marker>
    <marker id="edf-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1140" height="620" rx="24" fill="url(#edf-bg)"/>
  <rect width="1140" height="620" rx="24" fill="url(#edf-grid)" opacity="0.7"/>
  <rect x="24" y="24" width="1092" height="572" rx="18" fill="none" stroke="#293029" stroke-width="1.5"/>

  <text x="68" y="70" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700">Capability without a guarantee</text>
  <text x="68" y="98" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="14">The inherited system contains both remarkable capability and catastrophic failure modes</text>
  <line x1="68" y1="118" x2="1072" y2="118" stroke="#293029"/>

  <!-- Connections render behind the component cards. -->
  <path d="M298 388V418H470V446" fill="none" stroke="#00ff41" stroke-width="2.8" marker-end="url(#edf-green)"/>
  <path d="M842 388V418H670V446" fill="none" stroke="#ef4444" stroke-width="2.8" marker-end="url(#edf-red)"/>
  <line x1="570" y1="522" x2="570" y2="550" stroke="#f59e0b" stroke-width="2.8" marker-end="url(#edf-amber)"/>

  <text x="68" y="150" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">CAPABILITY</text>
  <rect x="68" y="166" width="460" height="222" rx="14" fill="#07150b" stroke="#00ff41" stroke-width="1.5"/>
  <text x="92" y="202" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">What the system can achieve</text>
  <line x1="92" y1="220" x2="504" y2="220" stroke="#204328"/>

  <circle cx="106" cy="252" r="5" fill="#00ff41"/>
  <text x="124" y="257" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="13">cells repair damaged tissue</text>
  <circle cx="106" cy="294" r="5" fill="#00ff41"/>
  <text x="124" y="299" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="13">minds reason, imagine, and create</text>
  <circle cx="106" cy="336" r="5" fill="#00ff41"/>
  <text x="124" y="341" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="13">groups build medicine and science</text>
  <text x="92" y="374" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">OBSERVED: extraordinary adaptive capability</text>

  <text x="612" y="150" fill="#ef4444" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">FAILURE MODES</text>
  <rect x="612" y="166" width="460" height="222" rx="14" fill="#1a1012" stroke="#ef4444" stroke-width="1.5"/>
  <text x="636" y="202" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">What the same system permits</text>
  <line x1="636" y1="220" x2="1048" y2="220" stroke="#4a2025"/>

  <circle cx="650" cy="252" r="5" fill="#ef4444"/>
  <text x="668" y="257" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="13">cell growth becomes a tumour</text>
  <circle cx="650" cy="294" r="5" fill="#ef4444"/>
  <text x="668" y="299" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="13">reason coexists with bias and fear</text>
  <circle cx="650" cy="336" r="5" fill="#ef4444"/>
  <text x="668" y="341" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="13">institutions preserve power and cruelty</text>
  <text x="636" y="374" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">OBSERVED: severe, persistent failure modes</text>

  <rect x="318" y="446" width="504" height="76" rx="12" fill="#10130d" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="570" y="476" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" letter-spacing="2">EVIDENCE FROM THE RESULT</text>
  <text x="570" y="504" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Judge the system by what it can do</text>

  <text x="570" y="578" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">DESIGNER INTENT ≠ RUNTIME CONTROL</text>
</svg>
