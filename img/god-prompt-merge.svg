<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 680" width="1140" height="680" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gp-title gp-desc">
  <title id="gp-title">God prompt vs composed fragments</title>
  <desc id="gp-desc">Three developers editing one file causes merge collisions. Owned fragments merge in CI into one rendered prompt.</desc>
  <defs>
    <linearGradient id="gp-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f120f"/>
    </linearGradient>
    <marker id="gp-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/>
    </marker>
    <marker id="gp-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00ff41"/>
    </marker>
  </defs>
  <rect width="1140" height="680" rx="24" fill="url(#gp-bg)"/>
  <rect x="24" y="24" width="1092" height="632" rx="18" fill="none" stroke="#293029" stroke-width="1.5"/>
  <text x="68" y="72" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700">The god prompt is a merge magnet</text>
  <text x="68" y="100" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="14">Everyone edits the same file → prose conflicts → contradictory instructions</text>
  <line x1="68" y1="118" x2="1072" y2="118" stroke="#293029"/>

  <!-- LEFT COLUMN -->
  <text x="68" y="148" fill="#ef4444" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">ANTI-PATTERN</text>
  <rect x="148" y="168" width="360" height="300" rx="14" fill="#1a1210" stroke="#ef4444" stroke-width="1.5"/>
  <text x="168" y="200" fill="#fb7185" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">system_prompt.txt</text>
  <text x="168" y="232" fill="#aeb6ae" font-family="'IBM Plex Mono', monospace" font-size="11">You are SupportBot…</text>
  <text x="168" y="258" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="11">&lt;&lt;&lt;&lt;&lt;&lt;&lt; feature/refunds</text>
  <text x="168" y="284" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="11">Never call delete_user…</text>
  <text x="168" y="310" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="11">=======</text>
  <text x="168" y="336" fill="#e0e0e0" font-family="'IBM Plex Mono', monospace" font-size="11">Always use billing API…</text>
  <text x="168" y="362" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="11">&gt;&gt;&gt;&gt;&gt;&gt;&gt; main</text>
  <text x="168" y="440" fill="#858c85" font-family="'Space Grotesk', sans-serif" font-size="13">Same lines · manual merge · tickets reopen</text>

  <!-- Devs below monolith — arrows UP into file -->
  <g id="dev-a">
    <rect x="108" y="500" width="96" height="40" rx="8" fill="#0f120f" stroke="#64748b"/>
    <text x="156" y="526" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">dev A</text>
  </g>
  <g id="dev-b">
    <rect x="280" y="500" width="96" height="40" rx="8" fill="#0f120f" stroke="#64748b"/>
    <text x="328" y="526" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">dev B</text>
  </g>
  <g id="dev-c">
    <rect x="452" y="500" width="96" height="40" rx="8" fill="#0f120f" stroke="#64748b"/>
    <text x="500" y="526" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">dev C</text>
  </g>
  <line x1="156" y1="500" x2="156" y2="476" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="328" y1="500" x2="328" y2="496" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="328" y1="478" x2="328" y2="476" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="500" y1="500" x2="500" y2="476" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="156" y1="476" x2="500" y2="476" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="328" y1="476" x2="328" y2="468" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#gp-red)"/>
  <text x="328" y="488" fill="#ef4444" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">all edits collide here</text>

  <!-- CENTER divider -->
  <line x1="570" y1="160" x2="570" y2="560" stroke="#293029" stroke-width="1" stroke-dasharray="8 6"/>
  <text x="570" y="580" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">vs</text>

  <!-- RIGHT: compose pipeline top to bottom -->
  <text x="620" y="148" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">COMPOSE (OWNED FRAGMENTS)</text>

  <rect x="700" y="168" width="340" height="52" rx="8" fill="#0f120f" stroke="#3c493e"/>
  <text x="720" y="192" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11">base/identity.md</text>
  <text x="720" y="210" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">@platform-team</text>

  <rect x="700" y="232" width="340" height="52" rx="8" fill="#0f120f" stroke="#3c493e"/>
  <text x="720" y="256" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11">base/tone.md</text>
  <text x="720" y="274" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">@product</text>

  <rect x="700" y="296" width="340" height="52" rx="8" fill="#0f120f" stroke="#3c493e"/>
  <text x="720" y="320" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11">agents/support/capabilities.md</text>
  <text x="720" y="338" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">@support-squad</text>

  <rect x="700" y="360" width="340" height="52" rx="8" fill="#0f120f" stroke="#00ff41" stroke-width="1.2"/>
  <text x="720" y="384" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="11">policies/support-prod.yaml</text>
  <text x="720" y="402" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">@security · enforced separately</text>

  <!-- Owned fragments feed a shared manifest bus; policy joins from below. -->
  <line x1="1040" y1="194" x2="1060" y2="194" stroke="#00ff41" stroke-width="1.5"/>
  <line x1="1040" y1="258" x2="1060" y2="258" stroke="#00ff41" stroke-width="1.5"/>
  <line x1="1040" y1="322" x2="1060" y2="322" stroke="#00ff41" stroke-width="1.5"/>
  <path d="M1060 194 V420 H720 V432" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#gp-green)"/>
  <path d="M870 412 V420" fill="none" stroke="#00ff41" stroke-width="1.5"/>

  <rect x="620" y="432" width="200" height="72" rx="12" fill="#0f120f" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="640" y="460" fill="#fbbf24" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1">CI</text>
  <text x="640" y="484" fill="#e0e0e0" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">render()</text>

  <text x="900" y="392" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="10">manifest order</text>

  <path d="M720 504 V512 H830 V520" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#gp-green)"/>

  <rect x="620" y="520" width="420" height="56" rx="12" fill="#0a1a0d" stroke="#00ff41" stroke-width="1.5"/>
  <text x="830" y="552" fill="#00ff41" font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle" font-weight="600">rendered system prompt (artifact)</text>

  <text x="68" y="648" fill="#858c85" font-family="'IBM Plex Mono', monospace" font-size="12">Small PRs per fragment · no hand-merge of the final blob</text>
</svg>
