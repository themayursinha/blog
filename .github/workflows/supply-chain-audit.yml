name: Supply Chain Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1.324.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Audit Ruby dependencies
        run: |
          gem install bundler-audit
          bundle audit check --update

      - name: Verify Docker digest pinning
        run: grep '^FROM ' Dockerfile | grep -q '@sha256:'

      - name: Verify GitHub Actions SHA pinning
        run: |
          ! grep -rE 'uses:\s+[^@]+@v[0-9]' .github/workflows/

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0